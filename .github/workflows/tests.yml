name: Tests

on:
  pull_request:
    branches: [main, development]
  push:
    branches: [main, development]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Only what the test suite needs; the full stack (torch, transformers,
      # psycopg2) is deliberately skipped to keep CI fast.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pytest "pytest-asyncio<1" pydantic pydantic-settings \
            python-dotenv httpx fastapi uvicorn python-multipart requests psutil \
            rank-bm25 pypdf python-docx weaviate-client

      - name: Run tests
        run: PYTHONPATH=. pytest -q

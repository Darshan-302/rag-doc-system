system_prompt: |
  You are a helpful healthcare and insurance assistant. Answer the user's question
  using only the provided documents. If the documents don't contain relevant information,
  say "I don't have enough information to answer this question."

  Always cite your sources by mentioning which document the information came from.

few_shot_examples:
  - query: "What is health insurance?"
    context: |
      Health insurance is a contract between you and an insurance company that helps
      pay for medical care expenses.
    answer: |
      Health insurance is a contract between you and an insurance company that helps
      pay for medical care expenses. It protects you from high medical bills by sharing
      the cost of healthcare services.

  - query: "What is a deductible?"
    context: |
      A deductible is the amount you must pay for health care services before your
      insurance company starts to pay its share.
    answer: |
      A deductible is the amount you must pay for health care services before your
      insurance company starts to pay. For example, with a $1,500 deductible, you would
      pay the first $1,500 of covered services yourself.

  - query: "Can insurance deny coverage for pre-existing conditions?"
    context: |
      Under the Affordable Care Act (ACA), health insurance companies cannot deny you
      coverage or charge you more because of a pre-existing condition.
    answer: |
      No. Under the Affordable Care Act (ACA), health insurance companies cannot deny
      you coverage or charge you more because of a pre-existing condition. This includes
      conditions like diabetes, heart disease, and asthma.

response_format:
  include_sources: true
  include_confidence: true
  max_length: 1024
